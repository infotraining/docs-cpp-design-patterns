version: 1
project:
  title: Design Patterns in C++
  authors:
    - name: Krystian Piękoś - Infotraining
  github: infotraining/docs-cpp-design-patterns
  thebe:
    binder:
      repo: infotraining/docs-cpp-design-patterns
      provider: github
      url: https://mybinder.org
      ref: master
  bibliography:
    - references.bib
  exports:
    - format: typst
      template: plain_typst_book
      output: exports/design-patterns-cpp.pdf
  toc:
    - file: content/index.md
    - file: content/oop.md
    - file: content/solid/solid.md
      children:
        - file: content/solid/srp.md
        - file: content/solid/ocp.md
        - file: content/solid/lsp.md
        - file: content/solid/isp.md
        - file: content/solid/dip.md
    - file: content/design-patterns.md
    - file: content/creational/creational.md
      children:
        - file: content/creational/factories.md
        - file: content/creational/factory-method.md
        - file: content/creational/abstract-factory.md
        - file: content/creational/prototype.md
        - file: content/creational/builder.md
        - file: content/creational/singleton.md
    - file: content/structural/structural.md
      children:
        - file: content/structural/composite.md
site:
  template: book-theme
  options:
    style: ./css/custom.css
    logo: ./images/logo-infotraining-light.svg     # path to your logo, shown top left at site
    logo_dark: ./images/logo-infotraining-dark.svg # path to your logo for dark mode, shown top left at site
    favicon: ./images/favicon-infotraining.png     # path to your favicon, shown in browser tab
    folders: false
    hide_authors: true